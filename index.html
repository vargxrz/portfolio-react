        var l = (navigator.language || 'pt').toLowerCase().indexOf('pt') === 0 ? 'pt' : 'en';

          l = localStorage.getItem('lang') || l;

        document.documentElement.setAttribute('lang', l === 'pt' ? 'pt-BR' : 'en');

    <title>João Vargas — Desenvolvedor Full-stack</title>
    <style>
      /* Boot loader: inline so it paints before any JS or CSS bundle arrives.
         Layout mirrors the site: wordmark where the header's sits, display type, mono metadata. */
      html.is-booting, html.is-booting body { overflow: hidden; }
      #boot {
        --b-bg: #1b2324; --b-ink: #ede4d3; --b-ink2: #8a948f; --b-line: #33403f; --b-accent: #f06a3b; --b-ok: #3ddc84; --b-legend: #1b1410;
        --b-gutter: clamp(16px, 4vw, 48px);
        position: fixed; inset: 0; z-index: 1000;
        display: grid; grid-template-rows: 64px 1fr auto; padding: 0 var(--b-gutter);
        background: var(--b-bg); color: var(--b-ink);
        font-family: 'Archivo', 'Helvetica Neue', Arial, sans-serif;
        clip-path: inset(0 0 0 0);
        transition: clip-path 0.9s cubic-bezier(0.76, 0, 0.24, 1);
      }
      html[data-theme='light'] #boot {
        --b-bg: #ede6d8; --b-ink: #1b2324; --b-ink2: #5c6664; --b-line: #cfc4af; --b-accent: #a33a0c; --b-ok: #1f8f4e; --b-legend: #fff7ee;
      }
      #boot.is-leaving { clip-path: inset(0 0 100% 0); }
      .boot__top { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
      /* the "jv." mark; its full stop blinks like a cursor while the page loads */
      .boot__mark { height: 34px; width: auto; overflow: visible; }
      .bm-ink { fill: var(--b-ink); }
      .bm-stop { fill: var(--b-accent); animation: boot-blink 0.9s steps(1) infinite; }
      .boot__pct-sign { color: var(--b-accent); }
      .boot__mono { font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 12px; color: var(--b-ink2); letter-spacing: .01em; }
      .boot__bottom { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; padding-bottom: clamp(24px, 5vh, 48px); }
      .boot__count {
        font-weight: 800; font-stretch: 125%; letter-spacing: -0.04em; line-height: 0.78;
        font-size: clamp(5rem, 19vw, 17rem); font-variant-numeric: tabular-nums;
        display: flex; align-items: flex-start;
      }
      .boot__pct-sign { font-size: 0.22em; letter-spacing: 0; margin: 0.12em 0 0 0.08em; }
      .boot__steps { display: grid; gap: 10px; min-width: 190px; padding-bottom: 6px; }
      .boot__step { display: grid; grid-template-columns: 14px 1fr; gap: 10px; align-items: baseline; opacity: .45; transition: opacity .3s ease, color .3s ease; }
      .boot__step.is-active { opacity: 1; color: var(--b-ink); }
      .boot__step.is-active i { color: var(--b-accent); animation: boot-blink .6s steps(1) infinite; }
      .boot__step.is-done { opacity: 1; }
      .boot__step.is-done i { color: var(--b-ok); }
      .boot__step i { font-style: normal; }
      .boot__line { position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: var(--b-line); }
      .boot__fill { position: absolute; inset: 0; background: var(--b-accent); transform-origin: left; transform: scaleX(0); }
      @keyframes boot-blink { 50% { opacity: 0; } }
      @media (max-width: 640px) {
        .boot__bottom { flex-direction: column-reverse; align-items: flex-start; }
        .boot__top .boot__mono { display: none; }
      }
      @media (prefers-reduced-motion: reduce) { #boot { transition-duration: .01ms; } .bm-stop { animation: none; } }
    </style>
  </head>
  <body>
    <div id="boot" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Carregando">
      <div class="boot__top">
        <svg class="boot__mark" viewBox="0 8 110 93" aria-hidden="true">
          <path class="bm-ink" d="M12 12 H26 V26 H12 Z" />
          <path class="bm-ink" d="M12 34 H26 V86 Q26 99 12 99 H2 V88 H7 Q12 88 12 83 Z" />
          <path class="bm-ink" d="M32 34 H47.5 L60 67.5 L72.5 34 H88 L68 78 H52 Z" />
          <path class="bm-stop" d="M93 64 H107 V78 H93 Z" />
        </svg>
        <p class="boot__mono boot__role"></p>
      </div>
      <div></div>
      <div class="boot__bottom">
        <p class="boot__count" aria-hidden="true"><span class="boot__num">0</span><span class="boot__pct-sign">%</span></p>
        <ol class="boot__steps boot__mono"></ol>
      </div>
      <div class="boot__line" aria-hidden="true"><div class="boot__fill"></div></div>
    </div>
    <script>
      (function () {
        var root = document.documentElement;
        root.classList.add('is-booting');
        var pt = root.getAttribute('lang') !== 'en';
        var STEPS = [
          ['fonts', pt ? 'carregando fontes' : 'loading fonts'],
          ['stage:hero', pt ? 'modelando as teclas' : 'modelling the keys'],
          ['stage:enter', pt ? 'compilando shaders' : 'compiling shaders'],
        ];
        var el = document.getElementById('boot');
        var num = el.querySelector('.boot__num');
        var fill = el.querySelector('.boot__fill');
        var list = el.querySelector('.boot__steps');
        el.setAttribute('aria-label', pt ? 'Carregando' : 'Loading');
        el.querySelector('.boot__role').textContent = pt ? 'Desenvolvedor Full-stack · Gaspar, SC' : 'Full-stack Developer · Gaspar, SC';
        var items = STEPS.map(function (s, i) {
          var li = document.createElement('li');
          li.className = 'boot__step' + (i === 0 ? ' is-active' : '');
          li.innerHTML = '<i>' + (i === 0 ? '●' : '○') + '</i><span>' + s[1] + '</span>';
          list.appendChild(li);
          return li;
        });

        // real progress comes in thirds; the counter eases toward it and creeps a little
        // ahead inside the current step, so it never sits frozen on a number
        var real = 0, shown = 0, creep = 0, finishing = false, onFull = null;
        var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        var last = performance.now();
        function frame(now) {
          var dt = Math.min((now - last) / 1000, 0.05); last = now;
          var ceiling = finishing ? 1 : Math.min(0.985, real + 0.3);
          creep = Math.min(ceiling, Math.max(creep, real) + dt * 0.09);
          var target = finishing ? 1 : creep;
          shown += (target - shown) * (reduce ? 1 : Math.min(1, dt * 7));
          if (finishing && 1 - shown < 0.004) shown = 1;
          var n = Math.floor(shown * 100);
          num.textContent = String(n);
          fill.style.transform = 'scaleX(' + shown + ')';
          el.setAttribute('aria-valuenow', String(n));
          if (shown >= 1 && onFull) { var f = onFull; onFull = null; f(); }
          if (shown < 1 || onFull) requestAnimationFrame(frame);
        }
        requestAnimationFrame(frame);

        function mark(done) {
          items.forEach(function (li, i) {
            var isDone = done.indexOf(STEPS[i][0]) !== -1;
            var isActive = !isDone && done.length === i;
            li.className = 'boot__step' + (isDone ? ' is-done' : isActive ? ' is-active' : '');
            li.firstChild.textContent = isDone ? '✓' : isActive ? '●' : '○';
          });
        }
        var done = [];
        window.__loader = {
          progress: function (p, next) {
            real = p;
            done = STEPS.map(function (s) { return s[0]; }).slice(0, STEPS.findIndex(function (s) { return s[0] === next; }) === -1 ? STEPS.length : STEPS.findIndex(function (s) { return s[0] === next; }));
            mark(done);
          },
          done: function () {
            real = 1; finishing = true;
            mark(STEPS.map(function (s) { return s[0]; }));
            return new Promise(function (resolve) {
              onFull = function () {
                setTimeout(function () {
                  el.classList.add('is-leaving');
                  root.classList.remove('is-booting');
                  setTimeout(resolve, 420);
                  setTimeout(function () { el.remove(); }, 1000);
                }, 260);
              };
            });
          },
        };
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
